<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵犀屏 · 长辈模式 · 场景预置方案</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151c;color:#eaf8ff;font-family:"PingFang SC","Microsoft YaHei",sans-serif}body{display:flex;align-items:center;justify-content:center}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid white;outline-offset:5px}button:disabled{opacity:.2;cursor:default}[hidden]{display:none!important}#screen{width:1280px;height:800px;position:relative;flex-shrink:0;overflow:hidden;transform-origin:center;background:radial-gradient(ellipse at 30% 4%,#554350 0,transparent 48%),radial-gradient(ellipse at 85% 100%,#51483e 0,transparent 50%),radial-gradient(ellipse at 8% 60%,#0e203b 0,transparent 53%),#26282b;user-select:none;-webkit-user-select:none}#screen:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 45%,#7771620a 58%,transparent 69%)}header{height:152px;display:flex;align-items:flex-start;padding:30px 57px;gap:25px;justify-content:flex-end}header .weather{display:flex;align-items:center;gap:9px;font-size:42px;margin-top:-10px;margin-right:-5px}.weather svg{width:43px;height:40px}.settings{width:64px;height:64px;padding:15px;border-radius:50%;background:#879baa26;margin-top:8px}.settings svg{width:36px;height:36px;color:#bedfee}.wifi{width:64px;height:61px;margin-top:13px;color:#d5f2ff}time{font-size:42px;line-height:70px;font-weight:600;letter-spacing:1px}.battery{font-size:27px;font-weight:700;color:#d1ebf5;position:relative;border:3px solid #c4dce6;border-radius:7px;line-height:29px;padding:1px 4px;margin:23px 0 0 0;box-shadow:inset 0 0 0 3px #293238}.battery:after{position:absolute;content:"";right:-8px;top:9px;width:5px;height:15px;border-radius:0 3px 3px 0;background:#b3cbd6}.grid{position:absolute;left:40px;right:54px;top:152px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:230px;gap:30px 28px;touch-action:pan-y}.tile{position:relative;display:flex;align-items:center;gap:13px;padding:24px 20px;border-radius:19px;background:linear-gradient(120deg,var(--c1),var(--c2));box-shadow:inset 0 1px 3px #ffffff32,0 3px 12px #00000018;transition:transform .16s,box-shadow .16s;min-width:0;touch-action:none}.tile:active{transform:scale(.985)}.tile .disc{display:flex;align-items:center;justify-content:center;width:160px;height:160px;border-radius:50%;background:#06286016;flex-shrink:0}.tile svg{width:112px;height:112px;overflow:visible}.tile .label{font-size:48px;white-space:nowrap;letter-spacing:1px;font-weight:400}.tile .label.long{font-size:37px;letter-spacing:0}.tile.add{background:#b3c3db16;border:2px solid #d7ebff63;box-shadow:inset 0 0 30px #adc5fa0b;justify-content:center;flex-direction:column;gap:13px}.add svg{width:72px;height:72px}.add .label{font-size:34px}.remove{position:absolute;right:-13px;top:-13px;border-radius:50%;width:46px;height:46px;background:#96b9f9;border:2px solid #c6dcff;font-size:38px;line-height:37px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #152c4e55;z-index:2}.editing .grid{top:182px;grid-auto-rows:215px;gap:25px 28px}.editing .tile .disc{width:145px;height:145px}.editing .tile{outline:1px solid #e0eaff44}.editing .tile:focus{outline:3px solid #e5f4ff}.editing header{opacity:.7}.editing header .weather{visibility:hidden}#editbar{position:absolute;top:115px;left:40px;right:54px;display:flex;align-items:center;justify-content:space-between;font-size:25px;gap:15px}#done,.primary{background:linear-gradient(135deg,#9cc0fb,#7395e2);border:1px solid #c0d9ff80;border-radius:30px;padding:10px 31px;font-size:27px}footer{position:absolute;left:34px;right:50px;bottom:30px;height:100px;display:flex;align-items:center;justify-content:space-between}.voice{display:flex;align-items:center;gap:16px;font-size:35px}.voice img{width:99px;height:99px;border-radius:50%;object-fit:cover;border:3px solid #f0e2e080;box-shadow:0 0 0 5px #c6b3b21a,0 0 14px #eac7be33}.voice button{border:1px solid #bcd3d442;border-radius:46px 46px 46px 0;background:#b6d1d40a;padding:18px 27px;font-size:35px}nav{display:flex;align-items:center;gap:1px}nav button{font-size:40px;min-width:40px;height:66px;padding:0 3px}#page{min-width:70px;font-size:40px;font-weight:500}#prev,#next{font-size:42px;opacity:.55}#prev:disabled,#next:disabled{opacity:0;pointer-events:none}.overlay{position:absolute;inset:0;background:#151c385e;backdrop-filter:blur(15px);z-index:10;display:flex;align-items:flex-end}.panel{width:100%;padding:35px 44px 32px;background:linear-gradient(140deg,#202944e8,#333451ed);border:1px solid #b1c5ee24;border-radius:20px 20px 0 0;max-height:680px;box-shadow:0 -10px 80px #0002}.panel h1{font-size:32px;font-weight:500;margin:0 0 6px}.panel p{font-size:23px;color:#c0cbe3;margin:0 0 26px}.close{position:absolute;right:35px;top:27px;font-size:43px;width:55px;height:55px;line-height:50px}.panel{position:relative}#choices{display:grid;grid-template-columns:repeat(6,1fr);gap:22px;max-height:440px;overflow-y:auto;padding:5px}.choice{position:relative;min-height:158px;border-radius:12px;background:#bdcce35e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 5px;font-size:23px;border:1px solid #d9e9ff22}.choice:not(:disabled):hover{outline:3px solid #e7f3ff;background:#bdcce37e}.choice svg{width:62px;height:62px}.choice .appicon{width:64px;height:64px;padding:7px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:16px}.choice:disabled{opacity:.37}.chosen{font-size:16px;position:absolute;right:7px;top:6px;border-radius:10px;background:#1d294955;padding:2px 7px}#toast{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);z-index:30;background:#141d31e8;border:1px solid #d7e6ff33;border-radius:14px;font-size:25px;padding:16px 25px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}#toast.show{opacity:1}.dragging{opacity:.5;transform:scale(.96)}.drop-target{outline:4px solid white!important;box-shadow:0 0 30px #aacaff77}.launch-panel{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#182337c7}.back{position:absolute;top:35px;left:35px;font-size:28px;padding:15px}.launch-panel h1{font-size:52px;font-weight:500;margin:20px 0 5px}.launch-panel p{font-size:24px;color:#aabbd0;margin-bottom:36px}#launchicon{width:160px;height:160px;padding:30px;border-radius:32px;background:linear-gradient(135deg,var(--c1),var(--c2))}#launchicon svg{width:100%;height:100%}

.scene-tile{padding-bottom:48px;text-align:left}.scene-label{display:flex;flex-direction:column;gap:6px}.app-name{font-size:24px;color:#eef5ffcc}.install-badge{position:absolute;bottom:20px;left:25px;right:25px;text-align:center;font-size:22px;color:#fff}.download-track{position:absolute;bottom:0;left:0;right:0;height:8px;background:#ffffff26;border-radius:0 0 18px 18px;overflow:hidden}.download-track span{display:block;height:100%;background:#effaff;transition:width .35s linear}#scene-note{position:absolute;top:430px;left:42px;right:54px;border:1px solid #ffffff20;background:#d4e1ff0a;border-radius:19px;padding:25px 30px;min-height:190px}#scene-note h2{margin:0 0 12px;font-size:30px;font-weight:500}#scene-note p{margin:0 0 15px;font-size:26px;color:#d0dce8}#scene-note small{font-size:18px;color:#a7b3c3}#install-status{font-size:22px;margin-top:12px;color:#bce5ff}#cancel-download{position:absolute;right:25px;bottom:20px;font-size:22px;border:1px solid #ffffff66;border-radius:25px;padding:9px 22px}.grid{touch-action:none}

.scene-tile{flex-direction:column;justify-content:center;gap:20px;padding:24px;border-radius:28px;background:linear-gradient(150deg,#8fd6ec,#edf1ec 83%);color:#172331;text-align:center}.scene-tile:nth-child(2){background:linear-gradient(150deg,#a3b6e7,#eff2ee 83%)}.scene-tile:nth-child(3){background:linear-gradient(150deg,#c5e2d8,#eef3ed 83%)}.scene-tile .label{font-size:43px;font-weight:600}.scene-app-icon{width:94px;height:94px;border-radius:23px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}.scene-app-icon svg{width:74px;height:74px}.scene-tile[data-app="douyin"] .scene-app-icon{background:#101118}.scene-tile[data-app="douyin"] svg{width:94px;height:94px}#download-page{position:absolute;inset:0;background:#090b10;z-index:20;color:#f3f7ff}.download-statusbar{position:absolute;left:38px;right:38px;top:22px;display:flex;justify-content:space-between;font-size:20px}#cancel-download{position:absolute;left:28px;right:auto;top:64px;bottom:auto;border:0;font-size:25px;padding:10px 12px;color:#d1d9e3}.download-center{position:absolute;left:0;right:0;top:255px;display:flex;flex-direction:column;align-items:center}#download-icon{width:108px;height:108px;padding:13px;border-radius:22px;background:linear-gradient(135deg,var(--c1),var(--c2));color:white}#download-icon svg{width:100%;height:100%}#download-name{font-size:28px;font-weight:500;margin:22px 0 34px}#download-progress{height:6px;width:600px;border-radius:5px;background:#525c72;overflow:hidden}#download-fill{display:block;height:100%;width:0;background:#d6f5ff;border-radius:5px;transition:width .35s linear}#download-message{font-size:27px;margin-top:26px}#retry-download{font-size:25px;border:1px solid #a5bad0;padding:12px 28px;border-radius:25px}.home-indicator{position:absolute;bottom:25px;left:calc(50% - 130px);width:260px;height:6px;background:#d8e9f5;border-radius:6px}

{id:'photo',name:'家庭相册',icon:'photo',colors:['#83bcaf','#468e7f']},{id:'cloud',name:'移动云盘',icon:'cloud',colors:['#8bc0f9','#4b7dda']},{id:'fitness',name:'移动健身',icon:'exercise',colors:['#8b99fa','#6261d6']},{id:'video',name:'移动智话',icon:'video',colors:['#9e96fc','#6c59ed']},{id:'migu',name:'咪咕悦看',icon:'tv',colors:['#edb662','#df7452']},{id:'migumusic',name:'咪咕音乐',icon:'music',colors:['#ec8bc5','#d24a9a']},{id:'game',name:'咪咕游戏',icon:'game',colors:['#a58af0','#7056b7']},{id:'repair',name:'移动排障',icon:'repair',colors:['#71b7f8','#547bd6']}];

let scenes=[
{id:'homecare',name:'移动看家',scene:'看家人',icon:'video',colors:['#42bdb9','#178c9e']},
{id:'chess',name:'咪咕游戏',scene:'玩棋牌',icon:'game',colors:['#a180e8','#7152c5']},
{id:'douyin',name:'抖音',scene:'看视频',icon:'music',colors:['#d85f85','#9f3668']}];
const $=id=>document.getElementById(id),svg=key=>`<svg viewBox="0 0 84 84" aria-hidden="true">${paths[key]}</svg>`,color=a=>`--c1:${a.colors[0]};--c2:${a.colors[1]}`;
// Demo installations last only until this page is refreshed or reopened.
let installed=[];
let page=0,job=null,timer=null,down=null,suppress=false,toastTimer;
function resize(){$('screen').style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/800)})`}addEventListener('resize',resize);resize();
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2000)}
function appIcon(a){if(a.id==='douyin')return '<svg viewBox="0 0 84 84" aria-hidden="true"><rect width="84" height="84" rx="19" fill="#101118"/><path d="M47 16v37a12 12 0 1 1-10-12v10a4 4 0 1 0 2 4V16zM47 16q2 14 17 15v10q-12-1-17-9" fill="#25f4ee" transform="translate(-2 1)"/><path d="M47 16v37a12 12 0 1 1-10-12v10a4 4 0 1 0 2 4V16zM47 16q2 14 17 15v10q-12-1-17-9" fill="#fe2c55" transform="translate(2 2)"/><path d="M47 16v37a12 12 0 1 1-10-12v10a4 4 0 1 0 2 4V16zM47 16q2 14 17 15v10q-12-1-17-9" fill="white"/></svg>';return svg(a.icon)}
function totalPages(){return 1+Math.ceil(scenes.length/6)}
function render(){page=Math.min(page,totalPages()-1);const list=page===0?catalog.slice(0,6):scenes.slice((page-1)*6,page*6);$('grid').replaceChildren(...list.map(a=>{const b=document.createElement('button');const recommended=page>0&&!installed.includes(a.id);b.className='tile'+(recommended?' scene-tile':'');b.style.cssText=color(a);b.dataset.app=a.id;b.setAttribute('aria-label',a.name);b.innerHTML=recommended?`<span class="scene-app-icon" style="${color(a)}">${appIcon(a)}</span><span class="label">${a.name}</span>`:`<span class="disc">${svg(a.icon)}</span><span class="label ${a.name.length>3?'long':''}">${a.name}</span>`;b.onclick=()=>{if(suppress)return;page===0?launch(a):activate(a)};return b}));$('page').textContent=`${page+1}/${totalPages()}`;$('prev').disabled=page===0;$('next').disabled=page===totalPages()-1;}
function renderDownload(){if(!job)return;const a=scenes.find(a=>a.id===job.id);$('download-icon').style.cssText=color(a);$('download-icon').innerHTML=appIcon(a);$('download-name').textContent=a.name;$('download-fill').style.width=job.progress+'%';$('download-progress').setAttribute('aria-valuenow',job.progress);$('download-message').textContent=job.phase==='error'?'网络未连接，请重试':job.phase==='install'?'下载完成，正在安装…':`正在下载… ${job.progress}%`;$('retry-download').hidden=job.phase!=='error';}
function activate(a){if(installed.includes(a.id)){launch(a);return}if(job)return;job={id:a.id,progress:0,phase:'download'};$('download-page').hidden=false;$('home').inert=true;$('cancel-download').focus();startDownload(a)}
function startDownload(a){job.phase='download';job.progress=0;renderDownload();if(navigator.onLine===false){job.phase='error';renderDownload();return}timer=setInterval(()=>{if(navigator.onLine===false){clearInterval(timer);job.phase='error';renderDownload();return}job.progress=Math.min(100,job.progress+10);if(job.progress===100){clearInterval(timer);job.phase='install';renderDownload();timer=setTimeout(()=>finish(a),800)}else renderDownload()},380)}
function finish(a){installed=[...new Set([...installed,a.id])];$('download-message').textContent='已添加到“我的应用”，加载中…';timer=setTimeout(()=>{job=null;timer=null;$('download-page').hidden=true;render();launch(a)},600)}
function cancel(){clearInterval(timer);clearTimeout(timer);job=null;timer=null;$('download-page').hidden=true;$('home').inert=false;render()}
$('cancel-download').onclick=cancel;$('retry-download').onclick=()=>{if(job?.phase==='error')startDownload(scenes.find(a=>a.id===job.id))};
function movePage(d){if(job)return;page=Math.max(0,Math.min(totalPages()-1,page+d));render()}$('prev').onclick=()=>movePage(-1);$('next').onclick=()=>movePage(1);$('page').onclick=()=>{page=(page+1)%totalPages();render()};
$('grid').onpointerdown=e=>{down={x:e.clientX,y:e.clientY};suppress=false};addEventListener('pointerup',e=>{if(down&&Math.abs(e.clientX-down.x)>70&&Math.abs(e.clientY-down.y)<80){suppress=true;movePage(e.clientX<down.x?1:-1);setTimeout(()=>suppress=false,250)}down=null});addEventListener('pointercancel',()=>{down=null});
function launch(a){$('launchicon').style.cssText=color(a);$('launchicon').innerHTML=svg(a.icon);$('launchname').textContent=a.name;$('launch').hidden=false;$('home').inert=true;$('back').focus()}
function back(){$('launch').hidden=true;$('home').inert=false} $('back').onclick=back;$('return').onclick=back;$('voice').onclick=()=>launch(catalog[0]);document.querySelector('.settings').onclick=()=>toast('当前为长辈模式');addEventListener('keydown',e=>{if(!$('download-page').hidden){if(e.key==='Escape')cancel();return}if(!$('launch').hidden){if(e.key==='Escape')back();return}if(e.key==='ArrowRight')movePage(1);if(e.key==='ArrowLeft')movePage(-1)});render();

// Static JSON models a backend-managed scenario feed. No user-editable list exists.
async function loadSystemScenes(){try{const response=await fetch('./scene-config.json',{cache:'no-store'});if(!response.ok)return;const config=await response.json();if(!Array.isArray(config.cards))return;const seen=new Set();const safe=config.cards.filter(a=>a.enabled!==false&&typeof a.id==='string'&&/^[a-z0-9_-]+$/.test(a.id)&&!seen.has(a.id)&&seen.add(a.id)&&typeof a.name==='string'&&a.name.length>0&&a.name.length<=12&&Object.hasOwn(paths,a.icon)&&Array.isArray(a.colors)&&a.colors.length===2&&a.colors.every(c=>/^#[0-9a-f]{6}$/i.test(c))).map(a=>({...a,name:a.name.replace(/[<>&"']/g,'')}));scenes=safe;render()}catch{ /* Standalone HTML retains the bundled system configuration. */ }}
loadSystemScenes();
</script></body></html>
