function render(){page=Math.max(0,Math.min(page,pages()-1));$('grid').replaceChildren(...[...presetIds,...custom,'add'].slice(page*6,page*6+6).map(homeTile));$('page').textContent=`${page+1}/${pages()}`;$('prev').disabled=page===0;$('next').disabled=page===pages()-1;}
function openEditor(){clearTimeout(holdTimer);down=null;draft=[...custom];editing=true;$('editor').hidden=false;$('home').inert=true;renderStaging();$('done').focus()}
function renderStaging(){$('staging').innerHTML='';[...draft,'add'].forEach(id=>{const a=storeApps.find(a=>a.id===id),item=document.createElement('div');item.className='stage-item';item.dataset.id=id;const tile=document.createElement('div');tile.className='stage-card';tile.tabIndex=0;tile.setAttribute('role','button');tile.setAttribute('aria-label',a?'排序'+a.name:'添加应用');if(a){tile.style.cssText=color(a);tile.innerHTML=svg(a.icon);const remove=document.createElement('button');remove.className='remove';remove.textContent='−';remove.setAttribute('aria-label','移除'+a.name);remove.onclick=e=>{e.stopPropagation();draft=draft.filter(x=>x!==id);renderStaging()};tile.append(remove);tile.onpointerdown=e=>{if(e.target.closest('.remove'))return;down={x:e.clientX,y:e.clientY,id};dragId=id;held=false};tile.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const to=draft.indexOf(id)+(e.key==='ArrowLeft'?-1:1);if(to>=0&&to<draft.length){draft=reordered(draft,id,draft[to]);renderStaging();$('staging').querySelector(`[data-id="${id}"] .stage-card`).focus()}}}}else{tile.classList.add('stage-add');tile.innerHTML=svg('plus');tile.onclick=()=>{if(!held)openPicker()};tile.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker()}}}const label=document.createElement('span');label.textContent=a?a.name:'添加';item.append(tile,label);$('staging').append(item)})}
function movePage(d){if(editing)return;page+=d;render()};$('prev').onclick=()=>movePage(-1);$('next').onclick=()=>movePage(1);$('page').onclick=()=>{page=(page+1)%pages();render()};
$('done').onclick=()=>{custom=normalizeCustom(draft);try{localStorage.setItem('lingxi-elder-custom',JSON.stringify(custom))}catch{}editing=false;$('editor').hidden=true;$('home').inert=false;render();toast('已保存')};
addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>10)clearTimeout(holdTimer);if(dragId&&Math.abs(dx)+Math.abs(dy)>12){held=true;$('staging').querySelector(`[data-id="${dragId}"]`)?.classList.add('dragging');document.querySelectorAll('.drop-target').forEach(n=>n.classList.remove('drop-target'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.stage-item');drop=target?.dataset.id;if(target&&drop!==dragId)target.classList.add('drop-target');}});
addEventListener('pointerup',e=>{clearTimeout(holdTimer);if(dragId&&held&&drop&&drop!==dragId){draft=reordered(draft,dragId,drop);renderStaging()}else if(down&&!editing&&Math.abs(e.clientX-down.x)>80&&Math.abs(e.clientY-down.y)<80){held=true;movePage(e.clientX<down.x?1:-1)}dragId=null;drop=null;down=null;document.querySelectorAll('.dragging,.drop-target').forEach(n=>n.classList.remove('dragging','drop-target'));setTimeout(()=>held=false,200)});
addEventListener('pointercancel',()=>{clearTimeout(holdTimer);dragId=null;down=null;drop=null;if(editing)renderStaging()});
function closePicker(){$('picker').hidden=true;$('editor').inert=false;$('staging').querySelector('.stage-add').focus()}
function openPicker(){$('picker').hidden=false;$('editor').inert=true;$('choices').innerHTML=storeApps.map(a=>`<button class="choice" data-app="${a.id}" style="${color(a)}" ${draft.includes(a.id)?'disabled':''}><span class="appicon">${svg(a.icon)}</span><span>${a.name}</span>${draft.includes(a.id)?'<span class="chosen">已添加</span>':''}</button>`).join('');$('choices').querySelectorAll('button').forEach(b=>b.onclick=()=>{draft.push(b.dataset.app);renderStaging();closePicker();toast('已添加'+storeApps.find(a=>a.id===b.dataset.app).name)});$('closepicker').focus()}
$('closepicker').onclick=closePicker;
function launch(a){$('launchicon').style.cssText=color(a);$('launchicon').innerHTML=svg(a.icon);$('launchname').textContent=a.name;$('launch').hidden=false;$('home').inert=true}
function back(){$('launch').hidden=true;$('home').inert=false} $('back').onclick=back;$('return').onclick=back;$('voice').onclick=()=>{toast('好的，为您打开电视');setTimeout(()=>launch(catalog[0]),700)};document.querySelector('.settings').onclick=()=>toast('当前为长辈模式');
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('picker').hidden)closePicker();else if(!$('launch').hidden)back();else if(editing)$('done').click()}if(!editing&&$('launch').hidden){if(e.key==='ArrowRight')movePage(1);if(e.key==='ArrowLeft')movePage(-1)}});render();
</script></body></html>
