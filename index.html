<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>灵犀浏览器 · 高保真可交互 Demo（Figma 版）</title>
<style>
/* ===================== 设计令牌（取自 Figma） ===================== */
:root{
  --bg-a:#071429; --bg-b:#10294F; --bg-c:#123A61;
  --t1:#F4F8FF; --t2:#A6BCD8; --t3:#7893B5; --t4:#335477;
  --cyan:#65DFFF; --cyan-d:#147FAE; --cyan-soft:#E8F3FA;
  --panel:#102A49; --card:#112B4B; --card-on:#163E66;
  --line:#345577; --line2:#284969; --line3:#2C4968;
  --key:#203E61; --key-on:#65DFFF;
  --btn:#19385C;
  --white:#FFFFFF; --ink:#1D3048; --ink2:#4D6075; --link:#2459BC;
  --ts:1;                       /* 阅读字号倍率 */
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:#04101f;overflow:hidden;}
body{
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  color:var(--t1);
}
#wrap{position:fixed;inset:0;display:grid;place-items:center;}
#stage{
  position:absolute;left:50%;top:50%;
  width:1920px;height:1080px;
  transform-origin:center center;
  transform:translate(-50%,-50%) scale(.5);
  background:linear-gradient(135deg,var(--bg-a) 0%,var(--bg-b) 60%,var(--bg-c) 100%);
  overflow:hidden;
  user-select:none;
}
#stage::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle 750px at 1370px 330px,rgba(36,86,168,.24) 0%,rgba(36,86,168,0) 100%);
  pointer-events:none;
}
.abs{position:absolute;}
svg{display:block;}
.ico{color:currentColor;}

/* ===================== 设备状态栏 ===================== */
.statusbar{position:absolute;left:80px;top:38px;width:1760px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;height:44px;}
.brand .g{width:36px;height:36px;color:var(--cyan);}
.brand .name{font-size:30px;font-weight:700;color:var(--t1);margin-left:18px;letter-spacing:.5px;}
.brand .sep{width:1px;height:24px;background:var(--t4);margin-left:18px;}
.brand .sub{font-size:22px;color:var(--t2);margin-left:19px;}
.nettime{display:flex;align-items:center;}
.nettime .w{width:25px;height:25px;color:var(--t2);margin-right:18px;}
.nettime .txt{font-size:22px;color:var(--t2);}
.nettime .time{font-size:26px;font-weight:500;color:var(--t1);margin-left:22px;}

/* ===================== 顶部搜索 ===================== */
.searchbar{
  position:absolute;left:240px;top:154px;width:1440px;height:104px;
  background:var(--t1);border-radius:28px;border:1px solid #C8DAEE;
  display:flex;align-items:center;padding:0 32px;
  box-shadow:0 10px 40px rgba(2,12,28,.35);
  transition:border-color .22s var(--ease),box-shadow .22s var(--ease);
  cursor:text;
}
.searchbar.focus{border:3px solid var(--cyan);box-shadow:0 0 0 6px rgba(101,223,255,.10),0 10px 40px rgba(2,12,28,.4);}
.searchbar .s-ico{width:32px;height:32px;color:#64748B;flex:0 0 auto;}
.searchbar .s-text{
  margin-left:24px;font-size:34px;color:#64748B;flex:1 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;
}
.searchbar .s-text.has{color:var(--ink);}
.searchbar .caret{display:inline-block;width:3px;height:42px;background:#1688BE;margin-left:1px;animation:blink 1.06s step-end infinite;}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.searchbar .s-mic{
  width:64px;height:64px;border-radius:20px;background:var(--cyan-soft);
  display:grid;place-items:center;color:var(--cyan-d);flex:0 0 auto;
  transition:background .2s var(--ease),color .2s var(--ease),transform .16s var(--ease);
}
.searchbar .s-mic svg{width:32px;height:32px;}
.searchbar .s-mic:hover{background:#D8EDF8;}
.searchbar .s-mic:active{transform:scale(.94);}
.searchbar .s-mic.live{background:var(--cyan);color:#073D5C;}

/* ===================== 首页 Tab ===================== */
.tabs{
  position:absolute;left:700px;top:292px;width:520px;height:72px;
  background:#0A1C35;border-radius:100px;border:1px solid var(--line2);
  display:flex;padding:6px;
}
.tab{
  width:250px;height:60px;border-radius:100px;display:flex;align-items:center;
  justify-content:center;gap:12px;font-size:26px;font-weight:500;color:var(--t2);
  transition:background .22s var(--ease),color .22s var(--ease);
  cursor:pointer;
}
.tab svg{width:24px;height:24px;}
.tab.on{background:#22547D;color:var(--t1);}
.tab.on svg{color:var(--cyan);}

/* ===================== 收藏格 ===================== */
.favs{position:absolute;left:192px;top:420px;width:1536px;}
.favs .head{display:flex;align-items:baseline;justify-content:space-between;height:49px;}
.favs .head .l{display:flex;align-items:baseline;}
.favs .head h2{margin:0;font-size:34px;font-weight:700;color:var(--t1);letter-spacing:.5px;}
.favs .head .slash{font-size:28px;color:var(--t3);margin:0 12px 0 16px;}
.favs .head .sub{font-size:28px;color:var(--t2);}
.favs .head .r{font-size:22px;color:var(--t2);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 24px;margin-top:26px;}
.site{
  height:202px;border-radius:28px;background:var(--card);border:1px solid var(--line);
  padding:28px;display:flex;flex-direction:column;justify-content:space-between;
  cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.site:hover{background:#15375B;border-color:#4B708F;transform:translateY(-3px);}
.site:active{transform:translateY(-1px) scale(.995);}
.site.on{background:var(--card-on);border:3px solid var(--cyan);box-shadow:0 0 26px rgba(85,223,255,.15);}
.site .row1{display:flex;align-items:center;}
.site .badge{
  width:68px;height:68px;border-radius:18px;display:grid;place-items:center;
  font-size:33px;font-weight:700;flex:0 0 auto;
}
.site .meta{margin-left:20px;min-width:0;}
.site .meta .nm{font-size:29px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:42px;}
.site .meta .dm{font-size:21px;color:var(--t2);line-height:30px;margin-top:4px;}
.site .row2{display:flex;align-items:center;justify-content:space-between;}
.site .row2 .use{font-size:22px;color:var(--t2);}
.site .row2 .go{width:24px;height:24px;color:var(--t3);}
.site.on .row2 .go{color:var(--cyan);}
.tip{display:flex;align-items:center;gap:12px;margin-top:26px;font-size:21px;color:var(--t3);}
.tip svg{width:22px;height:22px;color:var(--t3);flex:0 0 auto;}

/* ===================== 浏览历史 ===================== */
.history{position:absolute;left:240px;top:408px;width:1440px;}
.hgroup{height:41px;display:flex;align-items:baseline;justify-content:space-between;}
.hgroup.t2{margin-top:16px;}
.hgroup .g-t{font-size:28px;font-weight:500;color:var(--t1);}
.hgroup .g-n{font-size:21px;color:var(--t3);}
.hlist{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
.hrow{
  height:96px;display:flex;align-items:center;padding:0 28px;cursor:pointer;
  border-bottom:1px solid var(--line3);transition:background .18s var(--ease);
}
.hrow:last-child{border-bottom:0;}
.hrow:hover{background:#16375C;}
.hrow .badge{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:700;flex:0 0 auto;}
.hrow .body{margin-left:24px;flex:1 1 auto;min-width:0;}
.hrow .body .t{font-size:28px;font-weight:500;color:var(--t1);line-height:41px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hrow .body .s{font-size:21px;color:var(--t2);line-height:30px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hrow .tm{font-size:23px;color:var(--t2);margin:0 28px 0 24px;flex:0 0 auto;}
.hrow .ch{width:24px;height:24px;color:var(--cyan);flex:0 0 auto;}
.hbar{height:68px;display:flex;align-items:center;justify-content:space-between;margin-top:20px;}
.hbar .hint{font-size:21px;color:var(--t3);}
.btn{
  height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:16px;
  font-size:25px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:transform .16s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);
}
.btn:active{transform:scale(.97);}
.btn svg{width:28px;height:28px;flex:0 0 auto;}
.btn-ghost{background:var(--btn);border:3px solid var(--cyan);color:var(--t1);}
.btn-ghost.dim{opacity:.4;border-color:var(--line);pointer-events:none;}
.btn-solid{background:var(--cyan);color:#071429;border:3px solid var(--cyan);}
.btn-solid:hover{box-shadow:0 0 26px rgba(101,223,255,.35);}
.btn-plain{background:var(--btn);border:1px solid var(--line);color:var(--t1);}

/* ===================== 空状态 ===================== */
.empty{position:absolute;left:240px;top:408px;width:1440px;height:500px;display:flex;flex-direction:column;align-items:center;}
.empty .ring{width:144px;height:144px;border-radius:50%;background:#133354;border:1px solid #315577;display:grid;place-items:center;margin-top:71px;}
.empty .ring .in{width:112px;height:112px;border-radius:50%;border:1px solid #3C6687;display:grid;place-items:center;color:var(--cyan);}
.empty .ring .in svg{width:60px;height:60px;}
.empty h3{margin:24px 0 0;font-size:36px;font-weight:700;color:var(--t1);}
.empty p{margin:10px 0 0;font-size:25px;color:var(--t2);}
.empty .btn{margin-top:24px;padding:0 34px;}
.empty .hbar{position:absolute;left:0;right:0;top:536px;margin:0;padding:0;}

/* ===================== 屏幕键盘 ===================== */
.kb{position:absolute;left:240px;top:310px;width:1440px;height:668px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:32px;}
.kb .top{height:48px;display:flex;align-items:center;justify-content:space-between;}
.kb .modes{display:flex;}
.kb .mode{height:48px;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 24px 0 24px;font-size:24px;color:var(--t2);cursor:pointer;}
.kb .mode svg{width:24px;height:24px;}
.kb .mode.on{background:#27577B;color:var(--t1);}
.kb .mode.on svg{color:var(--cyan);}
.kb .top .stat{font-size:21px;color:var(--t2);}
.kb .cands{height:58px;background:#0B203C;border-radius:12px;display:flex;align-items:center;margin-top:20px;padding:0 24px;gap:32px;}
.kb .cands .lb{font-size:21px;color:var(--t3);}
.kb .cands .c{font-size:25px;color:var(--t1);cursor:pointer;transition:color .15s;}
.kb .cands .c:hover{color:var(--cyan);}
.kb .cands .h{font-size:20px;color:var(--t3);margin-left:auto;}
.kb .keys{height:308px;display:flex;flex-direction:column;justify-content:space-between;margin-top:20px;}
.kb .krow{display:flex;justify-content:center;gap:12px;height:68px;}
.key{
  width:112px;height:68px;border-radius:12px;background:var(--key);
  display:grid;place-items:center;font-size:26px;font-weight:500;color:#E6F0FF;
  cursor:pointer;transition:background .12s var(--ease),transform .1s var(--ease),color .12s var(--ease);
}
.key:hover{background:#2A4E75;}
.key:active{transform:scale(.95);}
.key.on{background:var(--key-on);color:#071429;}
.key.dim{opacity:.5;}
.kb .ops{height:68px;display:flex;justify-content:center;gap:16px;margin-top:20px;}
.op{
  height:68px;border-radius:20px;background:var(--btn);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:25px;font-weight:500;color:var(--t1);cursor:pointer;
  transition:background .16s var(--ease),transform .12s var(--ease);
}
.op:hover{background:#22456B;}
.op:active{transform:scale(.97);}
.op.pri{background:var(--cyan);border-color:var(--cyan);color:#071429;}
.op svg{width:28px;height:28px;flex:0 0 auto;}
.op svg{width:28px;height:28px;flex:0 0 auto;}
.op.pri:hover{box-shadow:0 0 22px rgba(101,223,255,.3);}
.kb .foot{font-size:20px;color:var(--t3);margin-top:20px;text-align:center;}

/* ===================== 语音面板 ===================== */
.voice{position:absolute;left:240px;top:310px;width:1440px;height:668px;background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:48px 48px 0;}
.voice .top{display:flex;align-items:center;justify-content:space-between;height:35px;}
.voice .top .m{display:flex;align-items:center;gap:12px;font-size:24px;color:var(--t2);}
.voice .top .m svg{width:24px;height:24px;color:var(--cyan);}
.voice .top .h{font-size:21px;color:var(--t3);}
.voice .mid{height:164px;margin-top:36px;display:flex;align-items:center;justify-content:center;gap:39px;}
.wave{width:151px;height:90px;display:flex;align-items:center;justify-content:space-between;}
.wave i{width:7px;border-radius:4px;background:var(--cyan);display:block;animation:wave 1.15s ease-in-out infinite;}
@keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.wave.err i{animation:none;height:12px!important;opacity:.35!important;border-radius:4px;}
.micbig{position:relative;width:164px;height:164px;display:grid;place-items:center;}
.micbig .r1{position:absolute;inset:0;border-radius:50%;border:1px solid var(--cyan);}
.micbig .r2{position:absolute;inset:15px;border-radius:50%;border:1px solid var(--cyan);opacity:.8;animation:pulse 2.4s ease-out infinite;}
.micbig .base{position:absolute;inset:30px;border-radius:50%;background:#225B80;border:1px solid var(--cyan);display:grid;place-items:center;color:var(--cyan);}
.micbig .base svg{width:48px;height:48px;}
.micbig.err .r2{animation:none;opacity:.35;}
.micbig.err .base{background:#1B3F5C;}
@keyframes pulse{0%{transform:scale(.92);opacity:.7}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
.voice .txt{text-align:center;}
.voice .txt h3{margin:36px 0 0;font-size:40px;font-weight:700;color:var(--t1);}
.voice .txt p{margin:12px 0 0;font-size:26px;color:var(--t2);}
.voice .acts{display:flex;justify-content:center;gap:20px;margin-top:34px;}
.voice .acts .btn{padding:0 20px;white-space:nowrap;}
.voice .switch{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:44px;font-size:25px;color:var(--t2);cursor:pointer;}
.voice .switch svg{width:26px;height:26px;color:var(--t2);}
.voice .switch .ch{width:22px;height:22px;}
.voice .switch:hover{color:var(--t1);}

/* ===================== 网页浏览 ===================== */
.webbar{position:absolute;left:72px;top:40px;width:1776px;height:88px;display:flex;gap:24px;}
.wb-home{width:88px;height:88px;border-radius:20px;background:#112A4B;border:1px solid var(--line);display:grid;place-items:center;color:var(--t1);cursor:pointer;transition:background .18s var(--ease),transform .14s var(--ease);}
.wb-home:hover{background:#1B3A5E;}
.wb-home:active{transform:scale(.95);}
.wb-home svg{width:36px;height:36px;}
.address{flex:1 1 auto;height:88px;border-radius:20px;background:#112A4B;border:1px solid var(--line);display:flex;align-items:center;padding:0 28px;min-width:0;}
.address .lock{width:28px;height:28px;color:var(--t2);flex:0 0 auto;}
.address .url{font-size:27px;color:var(--t1);margin-left:20px;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.address .div{width:1px;height:32px;background:var(--t4);margin:0 21px;}
.address .refresh{width:32px;height:32px;color:var(--cyan);cursor:pointer;transition:transform .5s var(--ease);flex:0 0 auto;}
.address .refresh.spin{transform:rotate(360deg);}
.wb-set{width:140px;height:88px;border-radius:20px;background:#112A4B;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:11px;color:var(--t1);cursor:pointer;font-size:25px;transition:background .18s var(--ease),border-color .18s var(--ease),transform .14s var(--ease);}
.wb-set:hover{background:#1B3A5E;border-color:#4B708F;}
.wb-set:active{transform:scale(.96);}
.wb-set svg{width:32px;height:32px;}
.wb-set.on{background:var(--card-on);border:3px solid var(--cyan);}

.webcard{
  position:absolute;left:72px;top:156px;width:1776px;height:846px;background:#fff;border-radius:20px;
  padding:30px 48px 0;overflow:hidden;
  box-shadow:0 24px 80px rgba(2,10,24,.45);
  animation:cardIn .34s var(--ease);
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* —— 搜索结果页 —— */
.webcard.at{padding:30px 72px 0;}
.sr-top{height:66px;display:flex;align-items:center;}
.sr-logo{font-size:38px;font-weight:700;color:#315CC9;letter-spacing:0;width:76px;flex:0 0 auto;white-space:nowrap;}
.sr-input{width:1000px;height:64px;border-radius:12px;border:1px solid #8099D7;margin-left:30px;display:flex;align-items:center;padding:0 0 0 22px;position:relative;}
.sr-input .q{font-size:26px;color:var(--ink);flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-input .go{position:absolute;right:4px;top:4px;height:54px;padding:0 26px;border-radius:10px;background:#315CC9;color:#fff;font-size:23px;display:grid;place-items:center;cursor:pointer;}
.sr-note{font-size:20px;color:#64748B;margin-left:30px;}
.sr-tabs{height:36px;display:flex;align-items:center;margin-top:18px;padding-left:140px;gap:38px;}
.sr-tabs span{width:44px;font-size:22px;color:#64748B;cursor:pointer;}
.sr-tabs span.on{color:var(--link);font-weight:700;}
.sr-line{height:1px;background:#E5EAF1;margin-top:18px;}
.sr-body{display:flex;gap:64px;margin-top:16px;}
.sr-list{width:1100px;flex:0 0 auto;}
.res{height:190px;border-radius:16px;padding:18px;border:2px solid transparent;margin:0 0 14px;cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease);overflow:hidden;}
.sr-list .res:nth-of-type(3){height:158px;}
.res:hover{background:#F6FAFF;}
.res.on{background:#F3FAFF;border-color:#47B9E7;}
.res .src{display:flex;align-items:center;height:30px;}
.res .src .si{width:28px;height:28px;border-radius:7px;background:#E7F0F6;display:grid;place-items:center;font-size:16px;font-weight:700;color:#367C70;}
.res .src .sn{font-size:21px;color:var(--ink);margin-left:12px;}
.res .src .su{font-size:19px;color:#64748B;margin-left:12px;}
.res .ttl{display:flex;align-items:center;margin-top:11px;}
.res .ttl .t{font-size:calc(29px * var(--ts));font-weight:500;color:var(--link);line-height:42px;}
.res .ttl .tag{margin-left:14px;padding:0 10px;height:27px;border-radius:5px;background:#EEF2F7;font-size:18px;color:#64748B;display:grid;place-items:center;}
.res .snip{font-size:calc(22px * var(--ts));color:var(--ink2);line-height:32px;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sr-side{width:516px;flex:0 0 auto;}
.sr-side h4{margin:20px 0 0;font-size:27px;line-height:39px;font-weight:700;color:var(--ink);}
.sr-side .kw{display:flex;align-items:center;height:35px;margin-top:24px;font-size:24px;color:var(--link);cursor:pointer;}
.sr-side .kw svg{width:21px;height:21px;color:#8597B1;margin-right:14px;}
.sr-side .kw:hover{text-decoration:underline;}
.sr-side .line{height:1px;background:#E5EAF1;margin:24px 0 25px;}
.prompt{background:#F5F8FC;border-radius:16px;padding:24px 24px 22px;}
.prompt .a{font-size:23px;font-weight:500;color:var(--ink);}
.prompt .b{font-size:21px;color:#64748B;line-height:30px;margin-top:12px;}
.sr-foot{font-size:19px;color:#64748B;margin-top:0;}

/* —— 文章页 —— */
.at-nav{height:44px;display:flex;align-items:center;justify-content:space-between;}
.at-brand{display:flex;align-items:center;}
.at-brand .bi{width:42px;height:42px;border-radius:12px;background:#E6F1ED;display:grid;place-items:center;font-size:27px;font-weight:700;color:#367C70;}
.at-brand .bn{font-size:29px;font-weight:700;color:var(--ink);margin-left:14px;}
.at-brand .bs{font-size:19px;color:#64748B;margin-left:28px;}
.at-menu{display:flex;gap:32px;}
.at-menu span{font-size:22px;color:#64748B;cursor:pointer;}
.at-menu span.on{color:#367C70;}
.at-line{height:1px;background:#E2E8EE;margin-top:22px;}
.at-body{display:flex;gap:64px;margin-top:23px;}
.at-main{width:1136px;flex:0 0 auto;}
.at-cat{font-size:19px;font-weight:500;color:#367C70;}
.at-title{font-size:calc(42px * var(--ts));font-weight:700;color:var(--ink);line-height:61px;margin-top:16px;}
.at-meta{font-size:21px;color:#64748B;margin-top:16px;}
.at-lead{font-size:calc(26px * var(--ts));color:var(--ink);line-height:38px;margin-top:16px;}
.sec{margin-top:16px;}
.sec h5{margin:0;font-size:calc(28px * var(--ts));font-weight:700;color:var(--ink);line-height:41px;}
.sec p{margin:6px 0 0;font-size:calc(24px * var(--ts));color:#43566B;line-height:35px;}
.at-note{font-size:19px;color:#64748B;margin-top:18px;}
.at-side{width:432px;flex:0 0 auto;margin-top:16px;}
.notes{background:#F2F6F3;border-radius:20px;padding:28px;height:367px;}
.notes .nt{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:700;color:#2C5E55;}
.notes .nt svg{width:26px;height:26px;}
.note{display:flex;margin-top:24px;}
.note .k{width:46px;font-size:26px;font-weight:700;color:#367C70;flex:0 0 auto;line-height:34px;}
.note .v{flex:1 1 auto;}
.note .v b{display:block;font-size:23px;font-weight:500;color:var(--ink);line-height:34px;}
.note .v i{display:block;font-style:normal;font-size:20px;color:#64748B;margin-top:4px;}
.at-tip{margin-top:21px;}
.at-tip .a{font-size:23px;font-weight:500;color:var(--ink);}
.at-tip .b{font-size:21px;color:#64748B;line-height:30px;margin-top:12px;}
.readbar{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--cyan),#3FA9E0);width:0;transition:width .3s var(--ease);}

/* ===================== 遥控提示 ===================== */
.remote{position:absolute;left:80px;top:1022px;width:1760px;height:32px;display:flex;align-items:center;justify-content:space-between;font-size:20px;}
.remote .l{color:var(--t2);}
.remote .r{color:var(--t3);}

/* ===================== 弹窗 ===================== */
.mask{position:absolute;inset:0;background:rgba(2,11,26,.788);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .24s var(--ease);z-index:40;}
.mask.show{opacity:1;pointer-events:auto;}
.dialog{
  width:940px;background:#132E50;border:1px solid #527392;border-radius:32px;padding:48px;
  box-shadow:0 40px 90px rgba(0,8,22,.44);
  transform:scale(.96) translateY(8px);transition:transform .26s var(--ease);
}
.mask.show .dialog{transform:none;}
.dialog .di{width:64px;height:64px;border-radius:18px;background:#234666;display:grid;place-items:center;color:var(--t1);}
.dialog .di svg{width:32px;height:32px;}
.dialog h3{margin:24px 0 0;font-size:38px;font-weight:700;color:var(--t1);}
.dialog .d1{margin:12px 0 0;font-size:28px;color:var(--t2);}
.dialog .d2{margin:12px 0 0;font-size:23px;color:var(--t2);}
.dialog .acts{display:flex;justify-content:flex-end;gap:24px;margin-top:57px;}
.dialog .acts .btn{width:220px;}

/* ===================== 设置面板（新增，替代右上角星标） ===================== */
.sheet{position:absolute;top:0;right:0;width:620px;height:1080px;background:#0E2744;border-left:1px solid #2C4A6E;z-index:35;
  transform:translateX(100%);transition:transform .32s var(--ease);box-shadow:-30px 0 80px rgba(0,8,22,.5);}
.sheet.show{transform:none;}
.sheet .sh{height:100px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid #24405F;}
.sheet .sh h3{margin:0;font-size:32px;font-weight:700;}
.sheet .sh .x{width:56px;height:56px;border-radius:16px;background:#1A3453;display:grid;place-items:center;color:var(--t2);cursor:pointer;transition:background .16s;}
.sheet .sh .x:hover{background:#24436A;}
.sheet .sh .x svg{width:28px;height:28px;}
.sheet .sb{padding:20px 40px 40px;}
.srow{display:flex;align-items:center;justify-content:space-between;min-height:96px;border-bottom:1px solid #1E3A59;}
.srow:last-child{border-bottom:0;}
.srow .lb{font-size:26px;font-weight:500;color:var(--t1);}
.srow .lb small{display:block;font-size:20px;font-weight:400;color:var(--t3);margin-top:6px;}
.sw{width:96px;height:52px;border-radius:100px;background:#1E3A59;position:relative;cursor:pointer;transition:background .22s var(--ease);flex:0 0 auto;}
.sw::after{content:"";position:absolute;left:5px;top:5px;width:42px;height:42px;border-radius:50%;background:#7A93AE;transition:transform .24s var(--ease),background .24s var(--ease);}
.sw.on{background:#1E6F92;}
.sw.on::after{transform:translateX(44px);background:var(--cyan);}
.seg{display:flex;background:#132E50;border-radius:14px;padding:4px;}
.seg div{padding:0 20px;height:48px;display:grid;place-items:center;font-size:22px;color:var(--t2);border-radius:11px;cursor:pointer;}
.seg div.on{background:#22547D;color:var(--t1);}
.srow .arrow{width:24px;height:24px;color:var(--t3);}
.sheet .ver{font-size:20px;color:var(--t3);line-height:32px;margin-top:24px;}

/* ===================== Toast ===================== */
.toast{
  position:absolute;right:72px;bottom:110px;height:64px;padding:0 28px 0 24px;border-radius:16px;
  background:#143F53;display:flex;align-items:center;gap:17px;font-size:24px;color:var(--t1);
  box-shadow:0 8px 24px rgba(7,32,50,.15);
  opacity:0;transform:translateY(12px);transition:opacity .26s var(--ease),transform .26s var(--ease);
  z-index:60;pointer-events:none;
}
.toast.show{opacity:1;transform:none;}
.toast svg{width:27px;height:27px;color:var(--cyan);}

[hidden]{display:none!important;}
</style>
</head>

function renderSearch(){
  const bar=$('#searchbar'), t=$('#sbText');
  const focused = (S.view==='keyboard');
  const voiceOn = (S.view==='voice');
  bar.classList.toggle('focus',focused||voiceOn);
  $('#micBtn').classList.toggle('live',voiceOn);
  if(S.q){
    t.classList.add('has');
    t.innerHTML='<span>'+esc(S.q)+'</span>'+(focused?('<span class="caret"></span>'):'');

    t.classList.remove('has');

  }
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const WAVE_H=[16,30,48,72,44,26,58,82,50,24];
const WAVE_O=[.35,.41,.46,.51,.57,.62,.68,.74,.79,.85];

      '<div class="micbig'+(err?' err':'')+'">'+

      '<div class="wave'+(err?' err':'')+'">'+WAVE_H.slice().reverse().map((h,i)=>'<i style="height:'+(err?12:h)+'px;opacity:'+(err?0.35:WAVE_O[9-i])+';animation-delay:'+(i*0.08)+'s"></i>').join('')+'</div>'+

/* ===================== 视图切换 ===================== */
const HINTS={
  fav:['方向键移动焦点  ·  确认键选择  ·  返回键返回','灵犀屏 / 家庭浏览器'],
  history:['方向键移动焦点  ·  确认键选择  ·  返回键返回','灵犀屏 / 家庭浏览器'],
  empty:['方向键移动焦点  ·  确认键选择  ·  返回键返回','灵犀屏 / 家庭浏览器'],
  keyboard:['方向键选择字母  ·  确认键输入  ·  返回键收起键盘','灵犀屏 / 家庭浏览器'],
  voice:['确认键完成搜索  ·  返回键取消语音输入','灵犀屏 / 家庭浏览器'],
  voiceErr:['确认键重新聆听  ·  返回键取消语音输入','灵犀屏 / 家庭浏览器'],
  results:['方向键浏览网页  ·  确认键打开链接  ·  返回键返回上一页','灵犀屏 / 单页浏览'],
  article:['方向键滚动阅读  ·  右上角设置可收藏  ·  返回键回到搜索结果','灵犀屏 / 单页浏览'],
};

function render(){
  const v=S.view;
  const isWeb = v==='web';
  $('#statusbar').hidden = isWeb;
  $('#searchbar').hidden = isWeb;
  $('#webbar').hidden = !isWeb;

  const homeChrome = !isWeb && v!=='keyboard' && v!=='voice';
  $('#tabs').hidden = !homeChrome || S.tab==='empty' && false;

  $('#favs').hidden   = !(homeChrome && S.tab==='fav');
  $('#history').hidden= !(homeChrome && S.tab==='history');
  $('#empty').hidden  = !(homeChrome && S.tab==='empty');

  $('#kb').hidden = v!=='keyboard';
  $('#voice').hidden = v!=='voice';
  $('#webcard').hidden = !isWeb;

  if($('#favs').hidden===false) renderFavs();
  if($('#history').hidden===false){ S.tab!=='empty'&&renderHistory(); }
  if($('#empty').hidden===false) renderEmpty();
  if(v==='keyboard') renderKb();
  if(v==='voice') renderVoice();
  if(isWeb) renderWeb();

  renderSearch();
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',
    (i===0&&S.tab==='fav')||(i===1&&(S.tab==='history'||S.tab==='empty'))));

  let key = (isWeb? (S.page==='article'?'article':'results') : (v==='voice'?(S.voiceErr?'voiceErr':'voice'):S.tab));
  if(v==='home' && S.tab==='fav') key='fav';
  const h=HINTS[key]||HINTS.fav;
  $('#hintL').textContent=h[0];
  $('#hintR').textContent=h[1];

  $('#sheet').classList.toggle('show',S.sheet);
  $('#maskClear').classList.toggle('show',S.modal);
  $('#swBm').classList.toggle('on',S.bookmarked);
  document.querySelectorAll('#segFs div').forEach((d,i)=>d.classList.toggle('on',i===S.fs));
  const total=S.hist.reduce((a,g)=>a+g.rows.length,0);
  $('#clearNote').textContent='将清除本机的 '+total+' 条浏览记录，不会删除我的收藏。';
  $('#bmHint').textContent = isWeb? '把当前页面留在首页收藏里' : '先打开一个网页再收藏';
  $('#swBm').style.opacity = isWeb? 1 : .45;
  $('#swBm').style.pointerEvents = isWeb? 'auto':'none';
  paintIcons();
}

/* ===================== 交互 ===================== */
function go(view,opt){
  Object.assign(S,opt||{});
  S.view=view;
  if(view==='home' && S.tab==='empty' && S.hist.every(g=>!g.rows.length)) S.tab='empty';
  S.py='';
  render();
}
function toast(msg){
  const t=$('#toast');
  t.innerHTML=ico('check')+'<span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(S.toastTimer);
  S.toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

const ACT={
  toKb(){ go('keyboard'); },
  toVoice(){ go('voice',{voiceErr:false}); },
  retryVoice(){ S.voiceErr=false; render(); },
  tabFav(){ go('home',{tab:'fav'}); },
  tabHis(){ go('home',{tab: S.hist.some(g=>g.rows.length)?'history':'empty'}); },
  toHome(){ go('home',{tab:'fav',bookmarked:false}); },
  openSite(g,el){ const i=+el.dataset.idx; go('web',{page:'results',q:SITES[i].n}); },
  openHist(g,el){ const u=el.dataset.u;
    if(u.indexOf('life.example')>=0){ go('web',{page:'article',q:'秋季养生'}); }
    else { go('web',{page:'results',q:'秋季养生'}); } },
  openArticle(){ go('web',{page:'article',q:'秋季养生'}); },
  doSearch(){ if(!S.q.trim()){ S.q='秋季养生'; } go('web',{page:'results'}); },
  refresh(){ const r=$('#wbRefresh'); r.classList.add('spin'); setTimeout(()=>r.classList.remove('spin'),520); toast('页面已刷新'); },
  openSheet(){ S.sheet=true; render(); },
  closeSheet(){ S.sheet=false; render(); },
  toggleBm(){
    if(S.view!=='web') return;
    S.bookmarked=!S.bookmarked; render();
    toast(S.bookmarked?'已添加到收藏':'已取消收藏');
  },
  fs0(){ S.fs=0; render(); }, fs1(){ S.fs=1; render(); }, fs2(){ S.fs=2; render(); },
  openClear(){ S.modal=true; S.sheet=false; render(); },
  clearCancel(){ S.modal=false; render(); },
  clearOk(){ S.modal=false; S.hist=S.hist.map(g=>({g:g.g,n:0,rows:[]}));
    go('home',{tab:'empty'}); toast('浏览历史已清除'); },
  modePy(){ S.mode='py'; S.sym=false; render(); },
  sym(){ S.sym=!S.sym; render(); },
  lang(){ S.mode = S.mode==='py'?'en':'py'; render(); },
  space(){ if(S.py){ S.q+=PY[S.py]||''; S.py=''; } else if(S.mode==='en'){ S.q+=' '; } else { S.q+='食谱'; } render(); },
  del(){ if(S.py){ S.py=S.py.slice(0,-1); } else { S.q=S.q.slice(0,-1); } render(); },
  key(g,el){
    const k=el.dataset.k;
    if(S.mode==='en'){ S.q+=k; render(); return; }
    if(S.sym){ S.q+=k; render(); return; }
    S.py+=k;
    if(PY[S.py]){ S.q+=PY[S.py]; S.py=''; }
    render();
  },
  cand(g,el){
    const c=el.dataset.c;
    if(PY[c]){ S.q+=PY[c]; } else { S.q+=c; }
    S.py=''; render();
  },
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const fn=ACT[el.dataset.act];
  if(!fn) return;
  e.preventDefault(); e.stopPropagation();
  fn(el.dataset.act,el);
});

/* ===================== 深链 ===================== */
function readHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h) return;
  const p=new URLSearchParams(h);
  const v=p.get('view');
  if(p.get('q')) S.q=p.get('q');
  if(v==='home'){ S.tab=p.get('tab')||'fav'; S.view='home'; }
  else if(v==='keyboard'){ S.view='keyboard'; }
  else if(v==='voice'){ S.view='voice'; S.voiceErr=p.get('err')==='1'; }
  else if(v==='web'){ S.view='web'; S.page=p.get('page')==='article'?'article':'results'; if(!p.get('q')) S.q='秋季养生'; }
  if(p.get('sheet')==='1') S.sheet=true;
  if(p.get('modal')==='clear'){ S.modal=true; }
  if(p.get('fs')) S.fs=+p.get('fs');
}
readHash();

/* ===================== 自适应缩放 ===================== */
function fit(){
  const s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
  stage.style.transform='translate(-50%,-50%) scale('+s+')';
}
window.addEventListener('resize',fit);

/* ===================== 起播 ===================== */
paintIcons();
render();
fit();
document.title='灵犀浏览器 · 高保真可交互 Demo（Figma 版）';
</script>
