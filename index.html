<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600">
<title>灵犀屏浏览器 · 高保真可交互 Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* 灵犀屏设计规范：主色 / 深蓝 / 圆角 / 字阶 */
  --brand:#1890FF; --brand-d:#0E7AE0; --brand-l:#E8F3FF; --brand-2:#4FB4FF;
  --navy:#0C447C; --navy-d:#0A3A68; --navy-l:#14639F;
  --bg:#FFFFFF; --bg2:#F5F8FC; --bg3:#EBF1F8; --bg4:#DFE8F3;
  --ink:#14202E; --ink2:#5B6878; --ink3:#8D97A5; --ink4:#B4BDC9;
  --line:#E3E8EF; --line2:#EFF3F8;
  --ok:#0FA958; --warn:#F8880A; --danger:#E8483D;
  --sh1:0 2px 8px rgba(17,45,78,.06);
  --sh2:0 8px 24px rgba(17,45,78,.10);
  --sh3:0 18px 48px rgba(17,45,78,.16);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:28px;
}
/* 深色模式（PRD 2.7 备选），设置页可切 */
.dark{
  --bg:#1A1C22; --bg2:#22252C; --bg3:#2A2E37; --bg4:#333844;
  --ink:#F2F4F7; --ink2:#AFB7C4; --ink3:#7A828F; --ink4:#5C6470;
  --line:#343944; --line2:#2C303A; --brand-l:#1B2E44;
  --sh1:0 2px 8px rgba(0,0,0,.32);
  --sh2:0 8px 24px rgba(0,0,0,.42);
  --sh3:0 18px 48px rgba(0,0,0,.52);
}
html,body{background:#E9EDF3;font-family:var(--font);color:var(--ink)}
body{padding:18px 18px 40px}
.wrap{display:flex;gap:16px;align-items:flex-start;justify-content:center}

/* ===== 设备 ===== */
.stagebox{position:relative;flex:none}
.device{width:1280px;height:800px;background:var(--bg);border-radius:22px;overflow:hidden;
  box-shadow:0 22px 64px rgba(12,40,80,.26),0 0 0 9px #1B1F26;transform-origin:top left;position:relative}
.screen{width:1280px;height:800px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink)}
.stagebox .tag{position:absolute;left:2px;top:-25px;font-size:12.5px;color:#69737F;letter-spacing:.03em}

/* ===== 评审面板 ===== */
.map{width:312px;flex:none;background:#fff;border-radius:14px;padding:15px 15px 18px;
  box-shadow:0 8px 26px rgba(20,40,70,.10);max-height:880px;overflow:auto}
.map h3{font-size:14.5px;color:#101820;margin-bottom:3px}
.map .sub{font-size:11.5px;color:#8A929C;line-height:1.65;margin-bottom:11px}
.map .grp{margin-top:12px}
.map .grp>label{font-size:11px;color:#9AA2AC;letter-spacing:.1em;display:block;margin-bottom:6px}
.map .pbtn{display:flex;width:100%;align-items:center;gap:7px;padding:7px 9px;margin-bottom:4px;
  border:1px solid #E4E8EE;background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;color:#2B3138;
  font-family:var(--font);text-align:left;transition:.14s}
.map .pbtn:hover{background:#F2F6FC;border-color:#C6D8EC}
.map .pbtn.on{background:#E8F3FF;border-color:var(--brand);color:#0B5FB0;font-weight:600}
.map .pbtn .k{color:#A8B0BA;font-size:11px;margin-left:auto}
.map .note{font-size:11px;color:#7A828F;line-height:1.8;margin-top:10px;padding-top:9px;border-top:1px dashed #E4E8EE}
.map .scale{display:flex;gap:5px;margin-top:9px}
.map .scale button{flex:1;padding:5px 0;font-size:11.5px;border:1px solid #E4E8EE;background:#fff;
  border-radius:6px;cursor:pointer;font-family:var(--font);color:#2B3138}
.map .scale button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ===== 浏览器通用 ===== */
.br{width:1280px;height:800px;display:flex;flex-direction:column;background:var(--bg)}
.appbar{flex:none;height:64px;display:flex;align-items:center;padding:0 46px;gap:14px}
.appbar .bk{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink2);transition:.14s}
.appbar .bk:hover{background:var(--bg3);color:var(--ink)}
.appbar .brand{font-size:21px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
.appbar .brand span{color:var(--brand)}
.appbar .sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink2);transition:.14s;position:relative}
.iconbtn:hover{background:var(--bg3);color:var(--ink)}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-left:6px}
.avatar:hover{box-shadow:0 0 0 3px var(--brand-l)}

/* 搜索框 —— 原型核心 */
.searchwrap{flex:none;padding:6px 100px 0;display:flex;flex-direction:column;align-items:center}
.searchbar{width:1080px;height:88px;border-radius:44px;background:var(--bg);border:1.5px solid var(--line);
  box-shadow:var(--sh1);display:flex;align-items:center;padding:0 30px;gap:18px;cursor:text;transition:.16s}
.searchbar:hover{border-color:#C9DCF2;box-shadow:var(--sh2)}
.searchbar.focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
.searchbar .ph{flex:1;font-size:26px;color:var(--ink3);letter-spacing:.01em}
.searchbar .val{flex:1;font-size:26px;color:var(--ink);display:flex;align-items:center;gap:1px}
.caret{width:2px;height:32px;background:var(--brand);display:inline-block;animation:bl 1.06s steps(1) infinite}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
.searchbar .mic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer;transition:.14s;flex:none}
.searchbar .mic:hover{background:var(--brand-l);color:var(--brand)}
.searchbar .mic.live{background:var(--brand);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,144,255,.45)}70%{box-shadow:0 0 0 16px rgba(24,144,255,0)}100%{box-shadow:0 0 0 0 rgba(24,144,255,0)}}

/* Tab 切换 */
.tabgroup{display:flex;gap:12px;margin-top:22px}
.tab{height:52px;padding:0 30px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--ink2);background:var(--bg3);cursor:pointer;transition:.16s;font-family:var(--font);border:none}
.tab:hover{background:var(--bg4);color:var(--ink)}
.tab.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(24,144,255,.28)}

/* 内容区 */
.content{flex:1;min-height:0;overflow:auto;padding:26px 100px 30px}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
.secttl{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.01em;margin-bottom:18px;
  display:flex;align-items:center;gap:12px}
.secttl .cnt{font-size:15px;font-weight:400;color:var(--ink3)}

/* 收藏网格 4×2 */
.favgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.favcard{height:128px;border-radius:var(--r-m);background:var(--bg);border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;
  transition:.18s;position:relative;overflow:hidden}
.favcard:hover{border-color:var(--brand);box-shadow:var(--sh2);transform:translateY(-3px)}
.favcard .logo{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;font-weight:700;letter-spacing:-.02em}
.favcard .nm{font-size:20px;color:var(--ink);font-weight:500}
.favcard.add{border-style:dashed;background:transparent;color:var(--ink3)}
.favcard.add:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}
.favcard.add .plus{font-size:34px;line-height:1;color:var(--ink4)}
.favcard.add:hover .plus{color:var(--brand)}
.favcard .rm{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;
  background:var(--bg3);display:none;align-items:center;justify-content:center;color:var(--ink3);font-size:14px}
.favcard:hover .rm{display:flex}

/* 历史列表 */
.daylb{font-size:19px;color:var(--ink3);margin:4px 0 10px;letter-spacing:.04em}
.hlist{width:1080px;border-radius:var(--r-m);background:var(--bg);border:1.5px solid var(--line);overflow:hidden}
.hrow{display:flex;align-items:center;gap:20px;padding:13px 22px;cursor:pointer;transition:.14s;
  border-bottom:1px solid var(--line2)}
.hrow:last-child{border-bottom:none}
.hrow:hover{background:var(--bg2)}
.hrow .th{width:104px;height:72px;border-radius:var(--r-s);flex:none;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.hrow .th .lb{font-size:14px;color:rgba(255,255,255,.82);letter-spacing:.1em}
.hrow .tt{flex:1;min-width:0}
.hrow .tt .a{font-size:24px;color:var(--ink);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tt .b{font-size:17px;color:var(--ink3);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tm{font-size:16px;color:var(--ink3);flex:none}
.hrow .go{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink4);flex:none}
.hrow:hover .go{color:var(--brand);background:var(--brand-l)}
.clearbar{display:flex;justify-content:center;padding:26px 0 6px}
.scrollfade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%);
  mask-image:linear-gradient(to bottom,#000 calc(100% - 34px),transparent 100%)}
.btnclear{height:52px;padding:0 40px;border-radius:26px;background:var(--bg3);color:var(--ink2);
  font-size:18px;border:none;cursor:pointer;font-family:var(--font);transition:.16s}
.btnclear:hover{background:#E1E9F3;color:var(--ink)}
.empty{padding:80px 0;text-align:center;color:var(--ink3);font-size:20px;line-height:1.8}

/* ===== 键盘输入（原型 3） ===== */
.kbpanel{width:1080px;margin:auto auto 52px;border-radius:var(--r-l);background:var(--bg2);
  border:1.5px solid var(--line);padding:20px 28px 24px;position:relative}
.kbhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modechip{height:46px;padding:0 22px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);
  color:var(--ink2);font-size:18px;cursor:pointer;font-family:var(--font);transition:.14s;display:flex;align-items:center;gap:8px}
.modechip:hover{border-color:var(--brand);color:var(--brand)}
.modechip.on{border-color:var(--brand);color:var(--brand);background:var(--brand-l);font-weight:600}
.cands{display:flex;align-items:center;gap:8px;height:64px;padding:0 8px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:hidden}
.cand{padding:8px 18px;border-radius:8px;font-size:24px;color:var(--ink);cursor:pointer;white-space:nowrap;transition:.12s}
.cand:hover,.cand.on{background:var(--brand-l);color:var(--brand-d)}
.cand .py{font-size:14px;color:var(--ink3);margin-left:6px}
.cands .tip{font-size:16px;color:var(--ink4);margin-left:8px}
.krow{display:flex;gap:9px;justify-content:center;margin-bottom:10px}
.key{height:58px;min-width:88px;flex:1;border-radius:9px;background:var(--bg);border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(17,45,78,.06);display:flex;align-items:center;justify-content:center;
  font-size:23px;color:var(--ink);cursor:pointer;transition:.08s;font-family:var(--font);user-select:none}
.key:hover{background:var(--bg3)}
.key:active{transform:translateY(1px);background:var(--brand-l)}
.key.fn{background:var(--bg4);font-size:17px;color:var(--ink2);min-width:96px;flex:none}
.key.wide{flex:none;width:300px;font-size:17px;color:var(--ink2)}
.kbfoot{display:flex;align-items:center;justify-content:flex-end;margin-top:16px;gap:12px}
.btnok{height:56px;padding:0 46px;border-radius:10px;background:var(--brand);color:#fff;font-size:20px;
  font-weight:600;border:none;cursor:pointer;font-family:var(--font);transition:.14s;box-shadow:0 6px 16px rgba(24,144,255,.28)}
.btnok:hover{background:var(--brand-d)}

/* ===== 语音输入（原型 1） ===== */
.voicezone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding-bottom:40px}
.vring{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#8FD2FF,#1890FF 62%,#0B62C4);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 18px rgba(24,144,255,.08),0 0 0 40px rgba(24,144,255,.05);
  animation:breathe 2.4s ease-in-out infinite;margin-bottom:36px}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 18px rgba(24,144,255,.08),0 0 0 40px rgba(24,144,255,.05)}
50%{transform:scale(1.04);box-shadow:0 0 0 26px rgba(24,144,255,.10),0 0 0 56px rgba(24,144,255,.05)}}
.vbars{display:flex;align-items:center;gap:7px;height:56px}
.vbars i{width:7px;border-radius:4px;background:#fff;animation:vb 1s infinite ease-in-out}
.vbars i:nth-child(1){height:16px;animation-delay:0s}
.vbars i:nth-child(2){height:30px;animation-delay:.1s}
.vbars i:nth-child(3){height:46px;animation-delay:.2s}
.vbars i:nth-child(4){height:34px;animation-delay:.3s}
.vbars i:nth-child(5){height:20px;animation-delay:.4s}
@keyframes vb{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.vstate{font-size:24px;color:var(--ink2);letter-spacing:.04em}
.vresult{font-size:52px;font-weight:700;color:var(--ink);letter-spacing:.02em;margin-top:10px;min-height:64px}
.vhint{font-size:19px;color:var(--ink3);margin-top:6px}
.vfoot{display:flex;gap:16px;margin-top:34px}
.vfoot button{height:64px;padding:0 44px;border-radius:32px;font-size:21px;cursor:pointer;font-family:var(--font);border:none}
.vstop{background:var(--brand);color:#fff;box-shadow:0 8px 20px rgba(24,144,255,.3)}
.vcancel{background:var(--bg3);color:var(--ink2)}

/* ===== 网页展示（原型 5） ===== */
.webbar{flex:none;height:96px;display:flex;align-items:center;padding:0 56px;gap:20px;background:var(--bg)}
.webbar .nb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink);cursor:pointer;transition:.14s}
.webbar .nb:hover{background:var(--bg3)}
.urlbar{flex:1;height:68px;border-radius:34px;border:1.5px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;padding:0 8px 0 24px;gap:14px;transition:.16s}
.urlbar:hover{border-color:#C9DCF2;background:var(--bg)}
.urlbar .ico{color:var(--ink3);flex:none;display:flex}
.urlbar .url{flex:1;font-size:22px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlbar .url b{color:var(--ink);font-weight:600}
.urlbar .rl{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer;flex:none}
.urlbar .rl:hover{background:var(--bg3);color:var(--brand)}
.urlbar .rl.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.starbtn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer;transition:.14s}
.starbtn:hover{background:var(--bg3);color:var(--gold,#FFB020)}
.starbtn.on{color:#FFB020}
.progress{flex:none;height:3px;background:var(--bg3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);width:36%;animation:loadbar 1.15s infinite ease-in-out}
@keyframes loadbar{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}
.webview{flex:1;min-height:0;overflow:auto;background:var(--bg2);position:relative}
.webview::-webkit-scrollbar{width:9px}
.webview::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:5px}
.webpage{width:1080px;margin:0 auto;background:#fff;min-height:100%;padding:22px 44px 70px;color:#222}
/* 百度结果页 */
.bdtop{display:flex;align-items:center;gap:22px;padding:6px 0 18px;border-bottom:1px solid #EDEFF2}
.bdlogo{font-size:34px;font-weight:700;color:#2932E1;letter-spacing:-.03em;flex:none;white-space:nowrap}
.bdsearch{flex:1;height:54px;border-radius:27px;border:1.5px solid #DDE3EA;display:flex;align-items:center;
  padding:0 22px;gap:12px;font-size:20px;color:#333}
.bdsearch .k{color:#999;font-size:19px}
.bdstat{font-size:16px;color:#999;padding:14px 0 8px}
.res{margin-bottom:26px;cursor:pointer}
.res:hover .rt{text-decoration:underline}
.rt{font-size:25px;color:#2440B3;line-height:1.45;margin-bottom:8px;font-weight:500}
.rt em{color:#C00;font-style:normal}
.rs{font-size:18px;color:#4A4A4A;line-height:1.85}
.rs em{color:#C00;font-style:normal}
.rm{font-size:15px;color:#008000;margin-top:7px}
.related{margin-top:30px;padding-top:20px;border-top:1px solid #EDEFF2}
.related .h{font-size:19px;color:#333;font-weight:600;margin-bottom:12px}
.related .chips{display:flex;flex-wrap:wrap;gap:10px}
.related .chips span{font-size:17px;color:#2440B3;background:#F3F6FB;padding:9px 16px;border-radius:8px;cursor:pointer}
.related .chips span:hover{background:#E8F1FF}
.skelweb{padding:40px 44px}
.sk{border-radius:8px;background:linear-gradient(90deg,#EEF1F5,#F7F9FC,#EEF1F5);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loadhint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--ink3);font-size:19px;pointer-events:none}
.loadhint .ldc{background:rgba(255,255,255,.94);border-radius:22px;padding:16px 28px;box-shadow:var(--sh2);
  display:flex;align-items:center;gap:14px;font-size:18px;color:var(--ink2)}

/* ===== 应用商店（深蓝，灵犀屏系统层） ===== */
.sys{width:1280px;height:800px;display:flex;flex-direction:column;color:#fff;
  background:linear-gradient(158deg,#12558F 0%,var(--navy) 48%,#083663 100%)}
.sysbar{flex:none;height:60px;display:flex;align-items:center;padding:0 40px;gap:16px;background:rgba(0,0,0,.16)}
.sysbar .bk{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sysbar .bk:hover{background:rgba(255,255,255,.12)}
.sysbar .ttl{font-size:21px;font-weight:600}
.sysbar .sp{flex:1}
.sysbar .clock{font-size:16px;color:rgba(255,255,255,.82)}
.shopbody{flex:1;display:flex;min-height:0}
.shopnav{flex:none;width:168px;padding:14px 10px;display:flex;flex-direction:column;gap:4px;
  border-right:1px solid rgba(255,255,255,.10)}
.shopnav .it{padding:11px 14px;border-radius:9px;font-size:16px;color:rgba(255,255,255,.7);cursor:pointer}
.shopnav .it:hover{background:rgba(255,255,255,.09);color:#fff}
.shopnav .it.on{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.shopmain{flex:1;padding:16px 26px;overflow:auto}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.appcard{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.16s;position:relative}
.appcard:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.appcard .ic{width:58px;height:58px;border-radius:13px;flex:none;overflow:hidden}
.appcard .nm{font-size:17px;font-weight:600}
.appcard .ds{font-size:12.5px;color:rgba(255,255,255,.62);margin-top:3px}
.badge-new{position:absolute;right:8px;top:8px;background:#FF5C5C;color:#fff;font-size:10px;
  padding:2px 6px;border-radius:5px;font-weight:700;letter-spacing:.04em}
/* 详情 */
.dtl{display:flex;gap:26px;padding:22px 30px}
.dtl .lft{width:336px;flex:none;min-width:0;display:flex;flex-direction:column;align-items:stretch}
.hero{display:flex;gap:16px;align-items:center;min-width:0}
.hero>div:last-child{min-width:0}
.hero{display:flex;gap:16px;align-items:center}

  +'<div class="bdstat">百度为您找到相关结果约 12,800,000 个</div>'
  + SERP.map(function(r,i){
      return '<div class="res" data-act="openres" data-arg="'+i+'">'
      +'<div class="rt">'+r.t+'</div><div class="rs">'+r.s+'</div><div class="rm">'+r.m+'</div></div>';
    }).join('')
  +'<div class="related"><div class="h">相关搜索</div><div class="chips">'
  +['秋季养生汤','秋季养生茶','秋季润燥食谱','秋季进补吃什么','秋季养生小常识'].map(function(c){
      return '<span data-act="relsearch" data-arg="'+c+'">'+c+'</span>'}).join('')
  +'</div></div></div>';
}

/* ================= 设置 ================= */

  +'<div class="content" style="padding-top:12px;padding-bottom:44px">'

  +'<div class="seg">'+MEMBERS.map(function(p,i){

  +'<div class="setrow"><div class="lb"><div class="a">清空浏览记录</div><div class="b">仅清除「'+m.n+'」的记录，其他成员不受影响</div></div>'
  +'<button class="btnclear" style="height:48px;padding:0 26px;font-size:17px" data-act="clearhist">清空</button></div>'

  +'<div style="font-size:15px;color:var(--ink3);line-height:1.95">'

  +'</div></div>';

/* ================= 弹层 ================= */
function overlayHTML(){
  if(!S.overlay) return '';
  if(S.overlay==='clear'){
    return '<div class="mask"><div class="dlg">'
    +'<h4>清空浏览记录？</h4><div class="st">将清除「'+MEMBERS[S.member].n+'」的全部浏览记录（6 条）。<br>其他家庭成员的记录不受影响，此操作不可撤销。</div>'
    +'<div class="acts"><button class="bghost" data-act="closemask">取消</button>'
    +'<button class="bdanger" data-act="doclear">确定清空</button></div></div></div>';
  }
  if(S.overlay==='shot'){
    const v=['home','keyboard','web'][S.shotIdx];
    return '<div class="mask"><div style="text-align:center">'
    +'<div style="width:900px;height:563px;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.5)">'
    +'<div style="width:1280px;height:800px;transform:scale(.703);transform-origin:top left">'+miniView(v)+'</div></div>'
    +'<div style="margin-top:16px"><button data-act="closemask" style="height:48px;padding:0 26px;border-radius:24px;border:none;background:rgba(255,255,255,.92);font-size:17px;cursor:pointer">关闭预览</button></div>'
    +'</div></div>';
  }
  if(S.overlay==='addfav'){
    return '<div class="mask"><div class="dlg">'
    +'<h4>添加快捷入口</h4><div class="st">选择要固定到首页的站点，或说「把当前网页加到快捷入口」。</div>'
    +'<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">'
    + FAVS.slice(0,6).map(function(f){return '<div style="padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:18px;cursor:pointer" data-act="pickfav">'+f.n+'</div>'}).join('')
    +'</div><div class="acts"><button class="bghost" data-act="closemask">取消</button></div></div></div>';
  }
  return '';
}
function toastHTML(){
  if(!S.toast) return '';
  return '<div class="toast">'+esc(S.toast)+(S.toastUndo?'<span class="u" data-act="undo">撤销</span>':'')+'</div>';
}

/* ================= 交互 ================= */
document.getElementById('screen').addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');
  if(!el) return;
  ACT(el.dataset.act,el.dataset.arg,e);
});

function startDl(){
  if(S.dl.done){ go('home'); return; }
  if(S.dl.active){ toast('正在下载 '+S.dl.pct+'%'); return; }
  S.dl={active:true,pct:0,done:false};
  render();
  clearInterval(window.__dl);
  window.__dl=setInterval(function(){
    S.dl.pct=Math.min(100,S.dl.pct+(S.dl.pct<76?7:3));
    if(S.dl.pct>=100){
      clearInterval(window.__dl);
      S.dl.done=true;S.dl.active=false;
      toast('浏览器已就绪，点击图标打开');
    }
    render();
  },180);
}

function doSearch(q){
  S.searchQ=q||S.input||'秋季养生';
  S.input=S.searchQ;S.py='';S.view='web';S.loading=true;S.starred=false;
  S.url='https://www.baidu.com/s?wd='+encodeURIComponent(S.searchQ);
  render();
  clearTimeout(window.__ld);
  window.__ld=setTimeout(function(){S.loading=false;render()},1700);
}

function ACT(a,g,e){
  switch(a){
    case 'back':
      if(S.view==='home'||S.view==='shop') go('desktop');
      else go('home');
      break;
    case 'toshops': go('shop'); break;
    case 'app':
      if(g==='浏览器') startDl();
      else toast('「'+g+'」为示意应用，本 Demo 只还原浏览器');
      break;
    case 'retrydl': toast('正在重试下载…'); break;
    case 'openapp': go('home'); break;
    case 'todesk': go('desktop'); break;
    case 'desk':
      if(g==='浏览器'){
        if(S.dl.done) go('home');
        else { go('shop'); toast('浏览器还没下载，在应用商城点「浏览器」即可下载'); }
      }
      else if(g==='应用商城') go('shop');
      else toast('「'+g+'」为非本期范围应用');
      break;
    case 'shot': S.shotIdx=+g;S.overlay='shot';render(); break;
    case 'closemask': S.overlay=null;render(); break;
    case 'tab': S.tab=g;render(); break;
    case 'tokb': S.view='keyboard';S.py='';if(!S.input)S.input='秋季养生';render(); break;
    case 'tovoice': startVoice(); break;
    case 'tovoicecancel': clearInterval(window.__vt);clearTimeout(window.__vt);S.voiceText='';go('keyboard'); break;
    case 'key':
      if(g==='⌫'){ if(S.py) S.py=S.py.slice(0,-1); else S.input=S.input.slice(0,-1); }
      else if(g==='⇧'||g==='?123'){ /* 示意，不处理 */ }
      else if(g==='搜索'){ doSearch(); return; }
      else if(g===' ') { S.input+=' '; }
      else { S.py+=g; }
      render(); break;
    case 'pickcand':
      if(!S.input||S.input.slice(-g.length)!==g) S.input+=g;
      S.py='';render(); break;
    case 'dokeysearch': doSearch(); break;
    case 'voicesearch': clearInterval(window.__vt);doSearch(S.voiceText||'秋季养生'); break;
    case 'gohome': go('home'); break;
    case 'reload':
      S.loading=true;render();
      clearTimeout(window.__ld);
      window.__ld=setTimeout(function(){S.loading=false;render()},1400);
      break;
    case 'star':
      S.starred=!S.starred;
      toast(S.starred?'已收藏到「我的收藏/常用」':'已取消收藏');
      break;
    case 'focusurl': go('keyboard',{input:S.searchQ||''}); break;
    case 'openres': toast('正在打开 '+SERP[+g].m); break;
    case 'relsearch': doSearch(g); break;
    case 'openfav': doSearch(g); break;
    case 'rmfav': e.stopPropagation(); toast('已从快捷入口移除「'+FAVS[+g].n+'」',true); break;
    case 'addfav': S.overlay='addfav';render(); break;
    case 'pickfav': S.overlay=null;toast('已添加到快捷入口'); break;
    case 'openhist':
      go('web',{searchQ:g,loading:true,starred:true});
      clearTimeout(window.__ld);
      window.__ld=setTimeout(function(){S.loading=false;render()},1500);
      break;
    case 'clearhist': S.overlay='clear';render(); break;
    case 'doclear': S.overlay=null;S.histCleared=true;S.tab='history';toast('已清空浏览记录',true); break;
    case 'undo': toast('已撤销'); break;
    case 'goset': go('settings'); break;
    case 'setfont': S.font=+g;render(); break;
    case 'toggledark': S.dark=!S.dark;render(); break;
    case 'toggleread': S.readMode=!S.readMode;toast(S.readMode?'阅读增强已开启':'阅读增强已关闭'); break;
    case 'setmember': S.member=+g;S.histCleared=false;toast('已切换到「'+MEMBERS[+g].n+'」'); break;
  }
}

function startVoice(){
  clearInterval(window.__vt);clearTimeout(window.__vt);
  S.view='voice';S.voiceText='';render();
  const full='秋季养生';
  let i=0;
  const iv=setInterval(function(){
    i++;
    S.voiceText=full.slice(0,i);
    render();
    if(i>=full.length){
      clearInterval(iv);
      window.__vt=setTimeout(function(){doSearch(full)},1100);
    }
  },260);
  window.__vt=iv;
}

/* ================= 页面地图 ================= */
const MAP=[
  {g:'应用商城（入口）',items:[['shop','商城 · 原地下载'],['desktop','灵犀屏桌面']]},
  {g:'原型 4 / 5 · 首页',items:[['home','快捷入口'],['home:history','浏览历史']]},
  {g:'原型 3 · 键盘输入',items:[['keyboard','键盘输入中']]},
  {g:'原型 1 · 语音输入',items:[['voice','语音输入中']]},
  {g:'原型 2 · 网页展示',items:[['web','网页搜索展示']]},
  {g:'其他',items:[['settings','设置（字号/深色）']]}
];
function renderMap(){
  const m=document.getElementById('map');
  m.innerHTML='<h3>灵犀屏浏览器 · 页面地图</h3>'
  +'<div class="sub">1280×800 横屏 · 灵犀屏设计规范<br>主色 #1890FF · 深蓝 #0C447C · 圆角 44 / 20 / 14</div>'
  +'<div class="scale"><button data-s="1" class="on">100%</button><button data-s="0.8">80%</button><button data-s="0.62">62%</button></div>'
  + MAP.map(function(gr){
      return '<div class="grp"><label>'+gr.g+'</label>'
      + gr.items.map(function(it){
          const p=it[0].split(':');
          const on=S.view===p[0]&&(!p[1]||S.tab===p[1]);
          return '<button class="pbtn'+(on?' on':'')+'" data-go="'+p[0]+'" data-tab="'+(p[1]||'')+'">'
          +it[1]+'<span class="k">'+p[0]+'</span></button>';
        }).join('')+'</div>';
    }).join('')
  +'<div class="note"><b>可交互热点</b><br>'
  +'· 应用商城 → 点「浏览器」→ 原地下载（环形进度）→ 点图标打开首页<br>'
  +'· 首页点搜索框 → 键盘；点右侧麦克风 → 语音<br>'
  +'· 键盘：点字母出候选词 → 点候选上屏 → 确定<br>'
  +'· 语音：自动识别「秋季养生」并自动搜索<br>'
  +'· 网页页：刷新 / 收藏 / 主页 / 点结果 / 相关搜索<br>'
  +'· 首页 tab → 浏览历史 → 清空（二次确认）<br>'
  +'· 右上角设置 → 字号三档 / 深色模式 / 成员切换</div>';
  m.querySelectorAll('[data-go]').forEach(function(b){
    b.onclick=function(){
      const v=b.dataset.go,tb=b.dataset.tab;
      if(tb) go(v,{tab:tb,histCleared:false}); else go(v);
    };
  });
  m.querySelectorAll('[data-s]').forEach(function(b){
    b.onclick=function(){ applyScale(parseFloat(b.dataset.s)); };
  });
}

/* 缩放与自适应 */
function applyScale(s){
  document.getElementById('device').style.transform='scale('+s+')';
  const box=document.getElementById('stagebox');
  box.style.width=(1280*s)+'px';box.style.height=(800*s)+'px';
  document.querySelectorAll('#map [data-s]').forEach(function(x){
    x.classList.toggle('on',Math.abs(parseFloat(x.dataset.s)-s)<0.001);
  });
}
function autoFit(){
  const avail=window.innerWidth-36-16-312;
  const s=Math.min(1,Math.max(0.5,avail/1280));
  applyScale(Math.round(s*100)/100);
}

/* 深链接：#view=home&tab=history&dark=1&font=1 */
(function initFromHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h) return;
  const p=new URLSearchParams(h);
  if(p.get('view')) S.view=p.get('view');
  if(p.get('tab')) S.tab=p.get('tab');
  if(p.get('dark')==='1') S.dark=true;
  if(p.get('font')) S.font=+p.get('font');
  if(p.get('overlay')) S.overlay=p.get('overlay');
  if(p.get('loading')==='1') S.loading=true;
  if(p.get('vt')) S.voiceText=p.get('vt');
  if(p.get('q')) S.searchQ=p.get('q');
  if(p.get('input')) S.input=p.get('input');
  if(p.get('dl')){
    const v=p.get('dl');
    S.dl=v==='done'?{active:false,pct:100,done:true}:{active:true,pct:+v,done:false};
  }
})();

/* 覆盖基础 render：加入字号档位 class */
function render(){
  const el=document.getElementById('screen');
  el.className='screen f'+S.font+(S.dark?' dark':'');
  el.innerHTML=viewHTML(S.view)+overlayHTML()+toastHTML();
  renderMap();
}

render();
autoFit();
window.addEventListener('resize',autoFit);
</script>
